# Minimal MedusaHC Python module config (4 tools)
# Copy sections into Config/medusahc/medusahc.cfg; deploy Scripts/*.py to klippy/extras/

[medusahc]
init_delay: 2.0
sync_mainsail_tools: 1
sync_mainsail_sensors: 1
y_safe: -5
y_latch: -57.6
x_shift: 9
fast_accel: 10000
fast_speed: 300
pin_e: ^!PF10

[medusahc_tool 0]
dock_pin: ^!PF2
x_base: 5

[medusahc_tool 1]
dock_pin: ^!PF1
x_base: 66

[medusahc_tool 2]
dock_pin: ^!PF0
x_base: 127

[medusahc_tool 3]
dock_pin: ^!PC15
x_base: 188
