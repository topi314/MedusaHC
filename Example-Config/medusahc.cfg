# Example config for Scripts/medusahc.py
#
# Add this include in printer.cfg (or your main config):
#   [include Example-Config/medusahc.cfg]
#
# Also ensure the python module file is available in your Klipper extras path.
# This repo uses: Scripts/medusahc.py

[medusahc]
# Delay (seconds) before INIT_SENSOR_STATE runs after klippy:ready
init_delay: 2.0

# Verbose RESPOND output from internal watcher/debug paths
verbose: 0

# Debounce collapse delay for pin event bursts
assign_delay: 0.0

# Optional: expose internal/debug commands as callable gcode commands.
# 0 = only public commands (recommended)
# 1 = also expose OPEN_MOVE, SET_CHECK, DROP_MOVE, etc.
expose_internal_commands: 0

# Shared motion/latch config
y_safe: -5
y_latch: -57.6
x_shift: 9
fast_accel: 10000
fast_speed: 300
y_prime: -52
y_brush: -38
x_prime_shift: 12

# Feeder latch extruder movements
e_open: -4
e_close: 0.5

# Extruder high-current multiplier used during feeder open
e_cur_high_mult: 1.6

# Integrated switch watch pins
# e = tool present in toolhead (1 when mounted)
# Per-tool dock pins are configured as `dock_pin` in [medusahc_tool N].
pin_e: ^!PF10


# -----------------------------------------------------------------------------
# Optional persisted offsets loader (recommended)
# -----------------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/saved_vars.cfg


# -----------------------------------------------------------------------------
# Calibration helper (sexball probe workflow)
# -----------------------------------------------------------------------------
[medusahc_calibrate]
# Position over your sexball/tool calibration probe
probe_z: 60
probe_x: 223
probe_y: 210
probe_speed: 10000

# Nozzle temp used by MHC_CALIBRATE_NOZZLE_PROBE_OFFSET
probe_nozzle_temp: 150

# Park location used after MHC_CALIBRATE_AND_SAVE_OFFSETS
park_x: 20
park_y: 220


# -----------------------------------------------------------------------------
# Per-tool profiles (new style)
# -----------------------------------------------------------------------------
[medusahc_tool 0]
dock_pin: ^!PF2
x_base: 10
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 8
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 20
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[medusahc_tool 1]
dock_pin: ^!PF1
x_base: 75
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 8
prime_speed: 20
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 20
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[medusahc_tool 2]
dock_pin: ^!PF0
x_base: 140
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 8
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 20
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[medusahc_tool 3]
dock_pin: ^!PC15
x_base: 205
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 8
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 20
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15


# -----------------------------------------------------------------------------
# Hardware sections medusahc commands expect to exist
# -----------------------------------------------------------------------------
# Set this to your actual servo pin used for feeder open/close.
[servo my_servo]
pin: PE9
initial_angle: 0


# -----------------------------------------------------------------------------
# T0..T3 wrappers (keep only the tool numbers you use)
# -----------------------------------------------------------------------------
[gcode_macro T0]
gcode:
    RESPOND MSG="SET T0"
    SET T=0

[gcode_macro T1]
gcode:
    RESPOND MSG="SET T1"
    SET T=1

[gcode_macro T2]
gcode:
    RESPOND MSG="SET T2"
    SET T=2

[gcode_macro T3]
gcode:
    RESPOND MSG="SET T3"
    SET T=3


# -----------------------------------------------------------------------------
# Notes
# -----------------------------------------------------------------------------
# 1) Do not keep duplicate sections active.
#    If MHC_macros.cfg is still included and defines SET/DROP/CLEAN/etc,
#    you must disable one side to avoid command registration conflicts.
#
# 2) Tool count is auto-inferred from [medusahc_tool N], pin_tN, or x_tN.
#
# 3) This file does not define your extruders, TMCs, or probe.
#    Those must exist in your main printer configuration.
