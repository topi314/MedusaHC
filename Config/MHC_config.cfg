[medusahc]
init_delay: 2.0
verbose: 0
assign_delay: 0.0

y_safe: -5
y_latch: -57.6
x_shift: 9
fast_accel: 10000
fast_speed: 300
y_prime: -52
y_brush: -38
x_prime_shift: 12
e_open: -4
e_close: 0.5
e_cur_high_mult: 1.6

# Toolhead switch (1 when a tool is mounted)
pin_e: ^!PF10

[medusahc_tool 0]
dock_pin: ^!PF2
x_base: 5
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 10
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 15
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[medusahc_tool 1]
dock_pin: ^!PF1
x_base: 66
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 10
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 15
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[medusahc_tool 2]
dock_pin: ^!PF0
x_base: 127
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 10
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 15
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[medusahc_tool 3]
dock_pin: ^!PC15
x_base: 188
offset_x: 0.0
offset_y: 0.0
offset_z: 0.0
prime_amount: 10
prime_speed: 30
prime_retract: 0.5
prime_retract_speed: 30
clean_move_x: 10
clean_move_y: -2
clean_move_speed: 15
clean_retract: 1.5
clean_retract_speed: 30
first_prime_flag: 1
first_prime_amount: 15
first_prime_speed: 15

[duplicate_pin_override]
pins: mcu:PF2, mcu:PF1, mcu:PF0, mcu:PC15, mcu:PF10, mcu:PG13, mcu:PG12, mcu:PG15

[extruder]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
microsteps: 32
rotation_distance: 4.55
pressure_advance: 0.03
pressure_advance_smooth_time: 0.019
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA0 
sensor_pin: PB0 
sensor_type: ATC Semitec 104GT-2
control: pid
pid_Kp: 36.193
pid_Ki: 16.086
pid_Kd: 20.358
min_temp: 0
max_temp: 290
max_extrude_cross_section: 9999999
max_extrude_only_distance: 700
min_extrude_temp: 0
smooth_time: 2.0

