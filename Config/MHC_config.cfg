[gcode_macro T0]
gcode:
    RESPOND MSG="SET T0"
    SET T=0

[gcode_macro T1]
gcode:
    RESPOND MSG="SET T1"
    SET T=1
    
[gcode_macro T2]
gcode:
    RESPOND MSG="SET T2"
    SET T=2
   
[gcode_macro T3]
gcode:
    RESPOND MSG="SET T3"
    SET T=3



[servo my_servo]
pin: PE9
initial_angle:0

[heater_fan fan1]
pin: PF7
heater: extruder
heater_temp: 50.0

[heater_fan fan2]
pin: PF9
heater: extruder1
heater_temp: 50.0

[heater_fan fan3]
pin: PF6
heater: extruder2
heater_temp: 50.0


[heater_fan fan4]
pin: PF8
heater: extruder3
heater_temp: 50.0


[verify_heater extruder]
check_gain_time: 20
hysteresis: 10
heating_gain: 1

[verify_heater extruder1]
check_gain_time: 20
hysteresis: 10
heating_gain: 1

[verify_heater extruder2]
check_gain_time: 20
